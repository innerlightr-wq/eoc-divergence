name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true

      - name: Forbidden constructs
        run: python3 scripts/check_forbidden.py

      - name: Axiom audit
        run: python3 scripts/check_axioms.py
